name: Deploy AMS to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'

      - name: Lint PHP Syntax
        run: |
          echo "==> Linting PHP files..."
          find application/ -type f -name "*.php" -exec php -l {} \; > /dev/null
          echo "==> All PHP files passed syntax checks!"

  deploy:
    name: Deploy to AWS EC2
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            echo "==> Deploying AMS updates to EC2..."

            APP_DIR="$HOME/ams"

            if [ ! -d "$APP_DIR" ]; then
              echo "==> Cloning ams repository..."
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "==> Fetching latest changes from origin/main..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Building and launching AMS containers..."
            docker compose down || true
            docker compose up --build -d

            echo "==> Pruning dangling docker images..."
            docker image prune -f

            echo "==> AMS deployment successfully completed!"

  deploy-ecs:
    name: Build, Push to ECR & Restart ECS
    needs: validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ams
          IMAGE_TAG: latest
        run: |
          echo "==> Building Docker image for AMS..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          echo "==> Pushing image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Restart ECS Service with New Code
        run: |
          echo "==> Triggering zero-downtime rolling update on ECS..."
          aws ecs update-service \
            --cluster multiapp-cluster-production \
            --service ams-service \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION || 'us-east-1' }}
          echo "==> ECS deployment successfully triggered!"
